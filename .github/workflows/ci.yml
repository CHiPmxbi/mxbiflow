name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries for Qt, PortAudio, PulseAudio and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libportaudio2 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            pulseaudio xvfb
      # PortAudio is built with PulseAudio and fails to initialise without a server to connect to.
      - name: Start a PulseAudio server
        run: pulseaudio --start --exit-idle-time=-1
      # Private git dependencies, read with a one-hour token of the cogsoma-ci GitHub App.
      # A fork has no App: it sets a CAGELAB_TOKEN secret that can read them.
      - id: cagelab-token
        if: vars.CI_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: cagelab
          repositories: cogmatrix-python,pymoteGO
      - name: Grant read access to private git dependencies
        env:
          CAGELAB_TOKEN: ${{ steps.cagelab-token.outputs.token || secrets.CAGELAB_TOKEN }}
        run: >-
          git config --global
          url."https://x-access-token:${CAGELAB_TOKEN}@github.com/cagelab/".insteadOf
          "https://github.com/cagelab/"
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run pyright
      # pyglet reads the screen sizes from an X display.
      - run: xvfb-run -a uv run python -m unittest discover -s tests
