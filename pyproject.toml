[project]
name = "mxbiflow"
version = "0.3.27"
description = "Framework and hardware drivers for MXBI behavioral experiments"
readme = "README.md"
authors = [{ name = "HuYang", email = "huyangcommit@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "gpiozero>=2.0.1.post3",
    "inflection>=0.5.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "matplotlib>=3.11.1",
    "mss>=10.2.0",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "py-mx-eye",
    "pydantic>=2.13.4",
    "pygame-ce>=2.5.8",
    "pyglet>=2.1.16",
    "pymotego>=0.1.6",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "qtawesome>=1.4.2",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "stamina>=26.1.0",
    "typer>=0.27.1",
    "varname>=1.0.0",
]

[project.optional-dependencies]
# Batteries-included logging: enables mxbiflow.utils.logger.setup_logging().
log = ["loguru>=0.7.3"]

[tool.pyright]
include = ["src/mxbiflow", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportPrivateUsage = "error"

[tool.uv.sources]
# Pinned to the mx_eye commit that changed the py-mx-eye SDK contract
# (PJendritza/mx_eye#29). There is no compatibility layer, so the driver and
# the tracker have to be updated together.
py-mx-eye = { git = "https://github.com/PJendritza/mx_eye.git", subdirectory = "packages/py-mx-eye", rev = "1280fbaa4073b39e2d2ad2db4aaf9a05924b7480" }


[project.scripts]
mxbi = "mxbi:main"
main = "mxbiflow.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["loguru>=0.7.3", "pyright>=1.1.411", "ruff>=0.16.4"]
