[project]
name = "mxbiflow"
version = "0.3.27"
description = "Framework and hardware drivers for MXBI behavioral experiments"
readme = "README.md"
authors = [{ name = "HuYang", email = "huyangcommit@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "cogmatrix",
    "cyclopts>=5.3.3",
    "gpiozero>=2.0.1.post3",
    "httpx>=0.28.1",
    "inflection>=0.5.1",
    "keyring>=25.7.0",
    "mss>=10.2.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "py-mx-eye",
    "pydantic>=2.13.4",
    "pygame-ce>=2.5.8",
    "pyglet>=2.1.16",
    "pymotego",
    "pyserial>=3.5",
    "pyside6>=6.11.2",
    "qtawesome>=1.4.2",
    "rich>=15.0.0",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "stamina>=26.1.0",
    "varname>=1.0.0",
]

[project.optional-dependencies]
# Batteries-included logging: enables mxbiflow.utils.logger.setup_logging().
log = ["loguru>=0.7.3"]

[tool.pyright]
include = ["src/mxbiflow", "tests"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportPrivateUsage = "error"

[tool.uv.sources]
# Pinned to the mx_eye commit that changed the py-mx-eye SDK contract
# (PJendritza/mx_eye#29). There is no compatibility layer, so the driver and
# the tracker have to be updated together.
py-mx-eye = { git = "https://github.com/PJendritza/mx_eye.git", subdirectory = "packages/py-mx-eye", rev = "44b684b56a413ba776aa8bea511c3864f7e36e0c" }
pymotego = { git = "https://github.com/cagelab/pymoteGO.git", rev = "bafbbb7e28ea9af407a0557ad0224a5c48e8c7d8" }
cogmatrix = { git = "https://github.com/cagelab/cogmatrix-python.git", subdirectory = "packages/sdk", rev = "22edf0f6233b2e24a98748569cc3b89eeefdb51c" }


[project.scripts]
mxbiflow = "mxbiflow.__main__:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "loguru>=0.7.3",
    "prompt-toolkit>=3.0.53",
    "pyright[nodejs]>=1.1.411",
    "ruff>=0.16.4",
]
