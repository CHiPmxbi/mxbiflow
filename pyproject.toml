[project]
name = "mxbiflow"
version = "0.3.20"
description = "Framework and hardware drivers for MXBI behavioral experiments"
readme = "README.md"
authors = [{ name = "HuYang", email = "huyangcommit@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "gpiozero>=2.0.1",
    "inflection>=0.5.1",
    "jinja2>=3.1.6",
    "keyring>=25.6.0",
    "matplotlib>=3.10.6",
    "mss>=10.1.0",
    "numpy>=2.4.1",
    "pandas>=2.3.2",
    "pillow>=11.3.0",
    "pydantic>=2.12.5",
    "pygame-ce>=2.5.6",
    "pyglet>=2.1.13",
    "pymotego>=0.1.6",
    "pyserial>=3.5",
    "pyside6>=6.10.1",
    "qtawesome>=1.4.1",
    "rich>=14.1.0",
    "sounddevice>=0.5.3",
    "soundfile>=0.13.1",
    "stamina>=26.1.0",
    "typer>=0.21.1",
    "varname>=0.15.0",
]

[project.optional-dependencies]
# Batteries-included logging: enables mxbiflow.utils.logger.setup_logging().
log = ["loguru>=0.7.3"]

[tool.pyright]
include = ["src/mxbiflow", "tests"]
exclude = ["src/mxbiflow/tasks"]
extraPaths = ["src"]
typeCheckingMode = "basic"
reportPrivateUsage = "error"

[tool.ruff]
extend-exclude = ["src/mxbiflow/tasks"]

[project.scripts]
mxbi = "mxbi:main"
main = "mxbiflow.main:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "loguru>=0.7.3",
    "pyright>=1.1.411",
    "ruff>=0.16.0",
]
