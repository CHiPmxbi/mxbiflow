[project]
name = "mxbiflow"
version = "0.3.13"
description = "mxbiflow is a toolkit based on pygame and pymxbi"
readme = "README.md"
authors = [{ name = "HuYang", email = "huyangcommit@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "gpiozero>=2.0.1",
    "inflection>=0.5.1",
    "jinja2>=3.1.6",
    "keyring>=25.6.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.6",
    "mss>=10.1.0",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "pillow>=11.3.0",
    "pyaudio>=0.2.14",
    "pydantic>=2.11.7",
    "pygame-ce>=2.5.6",
    "pymotego>=0.1.3",
    "pymxbi>=0.3.7",
    "pyserial>=3.5",
    "pyside6>=6.10.1",
    "qtawesome>=1.4.1",
    "rich>=14.1.0",
    "typer>=0.20.0",
    "varname>=0.15.0",
]

[project.scripts]
mxbi = "mxbi:main"
main = "mxbiflow.main:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
